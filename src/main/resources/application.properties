server.port=8080
spring.application.name=account
spring.profiles.active=qa
spring.config.import=optional:configserver:http://localhost:8071/

# MySQL DataSource (cards-mysql on 127.0.0.1:3307)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/accountdb_qa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator Endpoints (required for Spring Cloud Bus)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
server.error.include-message=always
server.error.include-binding-errors=always
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
